name: MarketWatch
options:
  bundleIdPrefix: com.marketwatch
targets:
  MarketWatch:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MarketWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marketwatch.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: MarketWatch
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
